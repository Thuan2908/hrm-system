<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mất kết nối máy chủ - HRM System</title>
    <style>
        :root {
            --emp-primary: #0F766E;
            --emp-primary-hover: #115E59;
            --emp-primary-bg: #F0FDFA;
            --emp-heading: #0F172A;
            --emp-text: #475569;
            --emp-muted: #64748B;
            --emp-border: #E2E8F0;
            --emp-surface: #FFFFFF;
            --emp-bg: #F8FAFC;
            --emp-danger: #EF4444;
            --emp-danger-bg: #FEF2F2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--emp-bg);
            color: var(--emp-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            line-height: 1.6;
        }

        .offline-container {
            width: 100%;
            max-width: 480px;
            background: var(--emp-surface);
            border: 1px solid var(--emp-border);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: var(--emp-primary-bg);
            border: 1px solid #CCFBF1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .icon-svg {
            width: 40px;
            height: 40px;
            color: var(--emp-primary);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.78rem;
            font-weight: 600;
            background: var(--emp-danger-bg);
            color: var(--emp-danger);
            border: 1px solid #FECACA;
            margin-bottom: 1.25rem;
            letter-spacing: 0.02em;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--emp-danger);
            display: inline-block;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        h1 {
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--emp-heading);
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 0.92rem;
            color: var(--emp-text);
            margin-bottom: 1.75rem;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 0.92rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            text-decoration: none;
            width: 100%;
            border: 1px solid transparent;
        }

        .btn-primary {
            background-color: var(--emp-primary);
            color: #FFFFFF;
            border-color: var(--emp-primary);
            box-shadow: 0 2px 8px rgba(15, 118, 110, 0.25);
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--emp-primary-hover);
            border-color: var(--emp-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .help-box {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px dashed var(--emp-border);
            font-size: 0.82rem;
            color: var(--emp-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .help-box code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background: #F1F5F9;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--emp-heading);
            font-weight: 600;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <main class="offline-container" role="main">
        <div class="icon-wrapper">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <!-- Disconnected Server/Cloud Icon -->
                <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" />
                <path d="m2 2 20 20" />
                <path d="M8 19h8" />
                <path d="M12 16v6" />
            </svg>
        </div>

        <div class="status-badge">
            <span class="status-dot"></span>
            <span>CHẾ ĐỘ NGOẠI TUYẾN</span>
        </div>

        <h1>Không thể kết nối máy chủ</h1>
        <p>
            Máy chủ HRM System (localhost) hiện đang dừng hoặc kết nối mạng bị gián đoạn. Bạn có thể thử kết nối lại khi máy chủ được khởi động.
        </p>

        <div class="actions">
            <button id="retry-btn" class="btn btn-primary" onclick="retryConnection()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10" />
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                </svg>
                <span>Thử kết nối lại</span>
            </button>
        </div>

        <div class="help-box">
            <span>Khởi động lại máy chủ:</span>
            <code>dotnet run</code>
        </div>
    </main>

    <script>
        function retryConnection() {
            const btn = document.getElementById('retry-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Đang kết nối lại...';
            setTimeout(() => {
                window.location.reload();
            }, 500);
        }

        // Tự động reload khi trình duyệt phát hiện mạng hoặc máy chủ online trở lại
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>

</html>
